server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed build files never change, so browsers can keep them for a year
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Web app manifest with the right type (older nginx versions don't know it)
  location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    add_header Cache-Control "no-cache";
  }

  # The service worker must never be cached, or phones would miss new versions
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # Everything else is the single-page app: reloading /day/2026-09-28 must return index.html
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
