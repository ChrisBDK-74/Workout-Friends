# Fly.io config for Workout Friends
# Change `app` to the name of the app you created on Fly (`fly apps list` shows it).

app = 'workout-friends'
primary_region = 'arn' # Stockholm. 'nrt' (Tokyo) works too; the app is small either way.

[build]
  [build.args]
    # Public values: they end up in the browser anyway, and RLS protects the data.
    VITE_SUPABASE_URL = 'https://pblxogfwlqlkplkeesut.supabase.co'
    VITE_SUPABASE_ANON_KEY = 'sb_publishable_zrQqw_4XGk_wBXifDGnNdw_iYwB0C56'

[http_service]
  internal_port = 8080
  force_https = true
  # Sleeps when nobody uses it and wakes on the next visit (a second or two), which keeps it nearly free
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
